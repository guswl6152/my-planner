<script>

const KEY='minimal-planner-2027-v1';
const $=id=>document.getElementById(id);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const date=s=>new Date(`${s}T12:00:00`);
const today=iso(new Date());
const initial=()=>({events:[],tasks:[],ddays:[],diary:{}});
let data;try{const raw=JSON.parse(localStorage.getItem(KEY));data=raw&&Array.isArray(raw.events)&&Array.isArray(raw.tasks)&&Array.isArray(raw.ddays)&&raw.diary&&typeof raw.diary==='object'&&!Array.isArray(raw.diary)?raw:initial()}catch{data=initial()}
let selected=today.startsWith('2027-')?today:'2027-01-01';let current=new Date(2027,Number(selected.slice(5,7))-1,1);let weekStart=date(selected);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
let storageAvailable=true;
try{localStorage.setItem('__planner_storage_test__','1');localStorage.removeItem('__planner_storage_test__')}catch(e){storageAvailable=false}
const save=()=>{if(!storageAvailable)return false;try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){storageAvailable=false;return false}};

function isMultiDay(e){return !e.movedTo && !!e.endDay && e.endDay>e.day}
let rangeFrame=0;

function drawRangeBars(id,count){
 const grid=$(id);if(!grid)return;
 grid.querySelectorAll('.continuous-range').forEach(el=>el.remove());
 const cols=Array.from(grid.children).filter(el=>el.classList.contains(id==='weekGrid'?'weekcol':'overview-day'));
 cols.forEach(c=>c.querySelectorAll('.range-spacer').forEach(el=>el.remove()));
 if(cols.length!==count)return;
 const entries=data.events.filter(e=>isMultiDay(e)&&visibleWeekly(e));
 const gridRect=grid.getBoundingClientRect();
 for(let row=0;row<count/7;row++){
  const rowCols=cols.slice(row*7,row*7+7);
  const firstDate=new Date(weekStart);firstDate.setDate(firstDate.getDate()+row*7);
  const lastDate=new Date(firstDate);lastDate.setDate(lastDate.getDate()+6);
  const first=iso(firstDate),last=iso(lastDate);
  const spans=entries.filter(e=>e.day<=last&&e.endDay>=first).sort((a,b)=>a.day.localeCompare(b.day)||b.endDay.localeCompare(a.endDay));
  const lanes=[];
  const positioned=spans.map(e=>{
   const from=Math.max(0,Math.round((date(e.day)-firstDate)/86400000));
   const to=Math.min(6,Math.round((date(e.endDay)-firstDate)/86400000));
   let lane=lanes.findIndex(lastEnd=>lastEnd<from);
   if(lane<0){lane=lanes.length;lanes.push(to)}else lanes[lane]=to;
   return {e,from,to,lane};
  });
  if(!positioned.length)continue;
  const heading=rowCols[0].querySelector('.day-heading');
  const headingBottom=heading?heading.getBoundingClientRect().bottom:rowCols[0].getBoundingClientRect().top+25;
  const rowTop=rowCols[0].getBoundingClientRect().top;
  const baseline=headingBottom-rowTop+7;
  const reserve=baseline+lanes.length*31+5;
  rowCols.forEach(c=>{const spacer=document.createElement('div');spacer.className='range-spacer';spacer.style.height=(lanes.length*31+10)+'px';c.querySelector('.day-heading')?.after(spacer)});
  positioned.forEach(({e,from,to,lane})=>{
   const leftCol=rowCols[from].getBoundingClientRect(),rightCol=rowCols[to].getBoundingClientRect();
   const bar=document.createElement('div');bar.className='continuous-range'+(category(e)==='P'?' personal-range':'')+(e.done?' event-complete':'');
   bar.style.left=(leftCol.left-gridRect.left+5)+'px';
   bar.style.width=Math.max(20,rightCol.right-leftCol.left-10)+'px';
   bar.style.top=(rowTop-gridRect.top+baseline+lane*31)+'px';
   bar.title=`${e.title} (${e.day} ~ ${e.endDay}) · 클릭하여 수정`;
   bar.setAttribute('role','button');bar.tabIndex=0;
   const cb=eventCheckbox(e);cb.addEventListener('click',ev=>ev.stopPropagation());
   const title=node('span',`${category(e)} ${e.title}`,'range-title');
   bar.append(cb,title);
   bar.addEventListener('click',()=>openEvent(e.id));
   bar.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openEvent(e.id)}});
   grid.append(bar);
  });
 }
}

$('todoForm').onsubmit=e=>{e.preventDefault();addTask($('todoText').value,$('todoDate').value,$('todoCategory').value);$('todoText').value=''};
$('ddayForm').onsubmit=e=>{e.preventDefault();const title=$('ddayText').value.trim(),day=$('ddayDate').value;if(!title||!day)return;data.ddays.push({id:uid(),title,day});save();$('ddayText').value='';renderDdays()};
$('diaryDate').onchange=renderDiary;$('diaryText').oninput=()=>{const key=$('diaryDate').value;if(!key)return;data.diary[key]=$('diaryText').value;save();$('saveStatus').textContent='저장되었습니다.'};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`planner-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5_000_000)throw Error('파일 크기가 너무 큽니다.');const raw=JSON.parse(await file.text()),v=raw.data;if(!v||!Array.isArray(v.events)||!Array.isArray(v.tasks)||!Array.isArray(v.ddays)||!v.diary||typeof v.diary!=='object'||Array.isArray(v.diary))throw Error('올바른 백업 파일이 아닙니다.');if(!confirm('현재 저장된 기록을 백업 파일로 교체할까요? 기존 기록은 덮어써집니다.'))return;data=v;save();renderAll();alert('복원되었습니다.')}catch(err){alert(`복원 실패: ${err.message}`)}finally{e.target.value=''}};
$('todoDate').value=selected;$('ddayDate').value=selected;$('diaryDate').value=selected;renderAll();storageNotice();
</script></body></html>
